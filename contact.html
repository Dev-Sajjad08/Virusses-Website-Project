    <body>
        <header>
            <!-- place navbar here -->
        </header>



         <div class="blog-wrap">


<h1>Your Concerns are important for us</h1>
</div>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 p-4 p-sm-5">
                <h2 class="text-center mb-4 fw-bold">Contact Us</h2>
                <form class="needs-validation" id="feedbackForm" novalidate>
                    <div class="mb-3">
                        <label for="userName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="userName" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>
                    <div class="mb-3">
                        <label for="userEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="userEmail" required>
                        <div class="invalid-feedback">Please enter a valid email.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="userComments" class="form-label">message</label>
                        <textarea class="form-control" id="userComments" rows="3" required></textarea>
                    </div>
                    <div class="d-grid"><button class="btn btn-primary" type="submit">Submit</button></div>
                </form>
            </div>
        </div>
        <div class="col-md-4">
            <iframe class="contact-map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3619.313992521778!2d67.14924997580421!3d24.88726914418349!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb339999415e0c3%3A0x36742eee0fd9c291!2sAptech%20Metro%20Star%20Gate!5e0!3m2!1sen!2s!4v1781696327642!5m2!1sen!2s" width="100%" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>
</div>
<script>
    (() => {
        'use strict'
        const form = document.getElementById('feedbackForm')
        form.addEventListener('submit', e => {
            if (!form.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
            form.classList.add('was-validated')
            alert("Your Message Recived Thabk you")
            form.reset()

        }, false)
    })()
</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 <script>
        $("document").ready(function () {
            $("header").load("header.html");
            $("footer").load("footer.html");
        })
    </script>
